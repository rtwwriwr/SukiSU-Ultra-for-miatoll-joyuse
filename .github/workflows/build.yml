name: Build SukiSU Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Run Build Script
        run: ./build.sh

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Image
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
