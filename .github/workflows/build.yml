name: Build SukiSU Kernel
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Clone Kernel and Integrate SukiSU
        run: |
          git clone -b lineage-22.2 https://github.com/LineageOS/android_kernel_xiaomi_sm6250.git kernel
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki
          
          DEFCONFIG="arch/arm64/configs/vendor/miatoll_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/vendor/xiaomi/miatoll_defconfig"
          fi
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG

      - name: Build Kernel
        run: |
          cd kernel
          make ARCH=arm64 O=out vendor/miatoll_defconfig
          make ARCH=arm64 O=out -j$(nproc)

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Image
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
